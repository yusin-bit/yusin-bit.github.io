# Render Blueprint — 빌림 API 서버 (billim-server/)
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → DB 값 3개만 입력하면 생성됩니다.
services:
  - type: web
    name: billim-rental
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./billim-server/Dockerfile
    dockerContext: ./billim-server
    buildFilter:
      paths:
        - billim-server/**
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://yusin-bit.github.io
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
